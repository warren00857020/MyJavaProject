# 資料庫設定（使用環境變數）
# JDBC_DATABASE_URL 優先（Railway 部署），否則使用 DB_URL（本地開發）
spring.datasource.url=${JDBC_DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/mydb}}
spring.datasource.username=${PGUSER:${DB_USERNAME:postgres}}
spring.datasource.password=${PGPASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA 設定
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 排除 MongoDB 自動配置
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# Google Places API（使用環境變數）
google.places.api.key=${GOOGLE_PLACES_API_KEY}

# Claude API（使用環境變數）
claude.api.key=${CLAUDE_API_KEY:}

# 伺服器埠號（Railway 會自動注入 PORT 環境變數）
server.port=${PORT:8080}

# Spring Boot Actuator 設定
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
