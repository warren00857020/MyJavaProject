# 資料庫設定（使用環境變數）
# Railway 會自動提供 DATABASE_URL，格式：postgresql://<user>:<password>@<host>:<port>/<database>
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/mydb}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA 設定
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 排除 MongoDB 自動配置
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# Google Places API（使用環境變數）
google.places.api.key=${GOOGLE_PLACES_API_KEY}

# 伺服器埠號（Railway 會自動注入 PORT 環境變數）
server.port=${PORT:8080}
